{% set version = "1.3-0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-propagate
  version: "{{ version|replace('-', '_') }}"

source:
  url:
    - {{ cran_mirror }}/src/contrib/propagate_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/propagate/propagate_{{ version }}.tar.gz
  sha256: 7e1561f91848fe93933bb2e2a2e5e89e0c46573ae4567fc8e242c55378250f1e

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib("c") }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib("m2w64_c") }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-rcpp
    - r-crayon
    - r-hdf5r
    - r-minpack.lm
    - r-nortest
  run:
    - r-base
    - r-rcpp
    - r-crayon
    - r-hdf5r
    - r-minpack.lm
    - r-nortest

test:
  commands:
    - $R -e "library('propagate')"           # [not win]
    - "\"%R%\" -e \"library('propagate')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=propagate
  license: GPL-2.0-or-later
  summary: Propagation of uncertainty using higher-order Taylor expansion and Monte Carlo simulation. Calculations of propagated uncertainties are based on matrix calculus including covariance structure according to Arras 1998 <doi:10.3929/ethz-a-010113668> (first order), Wang & Iyer 2005 
    <doi:10.1088/0026-1394/42/5/011> (second order) and BIPM Supplement 1 (Monte Carlo) <doi:10.59161/JCGM101-2008>.
  license_family: GPL2
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2'
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
    - khughitt
